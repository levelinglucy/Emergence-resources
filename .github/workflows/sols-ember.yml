name: Sol's Ember regression
on:
  push:
    branches: [main]
    paths: ['sols-ember/**', '.github/workflows/sols-ember.yml']
  pull_request:
    paths: ['sols-ember/**', '.github/workflows/sols-ember.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sols-ember
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify lineage and run disposable tests
        working-directory: sols-ember
        env:
          PYTHONPATH: src
        run: |
          python -m sols_ember verify examples/sols_ember_lineage.jsonl
          python -m unittest discover -s tests -v
